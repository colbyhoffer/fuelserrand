# Fuels Errand daily pipeline: fetch news + prices + investor docs, summarize,
# email the brief, commit the data, and redeploy the static site.
#
# 11:30 UTC = 6:30am Central during daylight time (CDT). During standard time
# (Nov-Mar) it lands at 5:30am CT; adjust to 12:30 UTC in November if you care.

name: Daily brief

on:
  schedule:
    - cron: '30 11 * * 1-5'
    # Backup firing ~90 min later: GitHub sometimes skips scheduled runs.
    # A guard step below makes this a no-op when the morning run succeeded.
    - cron: '0 13 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip sending the email'
        type: boolean
        default: false
      baseline:
        description: 'First run: catalogue existing IR docs without analyzing'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Schedule guard: any scheduled firing is a no-op once today's brief
      # exists. The primary trigger is an external pinger (workflow_dispatch,
      # never guarded); GitHub's own crons are delay-prone backups.
      - name: Check whether today's brief already exists
        id: guard
        run: |
          TODAY=$(TZ=America/Chicago date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "data/briefs/$TODAY.json" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Brief for $TODAY already exists — scheduled firing is a no-op."
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.guard.outputs.skip != 'true'

      - name: Run pipeline
        if: steps.guard.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          BRIEF_TO: ${{ vars.BRIEF_TO || 'hoffercolby@gmail.com' }}
          BRIEF_FROM: ${{ vars.BRIEF_FROM || 'Fuels Errand <onboarding@resend.dev>' }}
        run: |
          FLAGS=""
          [ "${{ inputs.dry_run }}" = "true" ] && FLAGS="$FLAGS --dry-run"
          [ "${{ inputs.baseline }}" = "true" ] && FLAGS="$FLAGS --baseline"
          npx tsx pipeline/run.ts $FLAGS

      - name: Commit data
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "fuels-errand-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily brief $(date -u +%F) [skip ci]"
          git push

      - name: Build site
        if: steps.guard.outputs.skip != 'true'
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        if: steps.guard.outputs.skip != 'true'
        with:
          path: out

      - uses: actions/deploy-pages@v4
        if: steps.guard.outputs.skip != 'true'
